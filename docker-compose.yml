services:
  dingchang-backend:
    build: .
    container_name: dingchang_backend
    restart: always

    # 只让本机访问（给 Nginx 反代），不要暴露到公网
    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      - TZ=Asia/Shanghai

    volumes:
      # 持久化：本地存储与日志
      - ./storage:/app/storage
      - ./logs:/app/logs

    # 健康检查（可选，但强烈建议）
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
